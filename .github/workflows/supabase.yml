name: Supabase

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:
    inputs:
      run_test_import:
        description: Import the 2026 FBS teams, conferences, and calendar after deployment
        required: true
        default: false
        type: boolean
      import_2025_stage:
        description: Run one resumable stage of an archived season import (recompute rebuilds awards, Heisman and summary without API calls)
        required: true
        default: skip
        type: choice
        options:
          - skip
          - setup
          - games
          - boxscores
          - rankings
          - season-stats
          - awards
          - recompute
      import_season:
        description: Season for the archived import stage (2025 unless an earlier season is imported)
        required: false
        default: '2025'
        type: string
      import_roster:
        description: Import team rosters for the season above (all = one call for every FBS team, teams = a slice of teams one by one)
        required: true
        default: skip
        type: choice
        options:
          - skip
          - all
          - teams
      roster_offset:
        description: First team of the slice for the roster mode teams (40 teams per run, so 0, 40, 80, 120)
        required: false
        default: '0'
        type: string
      import_draft:
        description: Import the first round of the real NFL drafts after every archived season (one CFBD call per draft year)
        required: true
        default: false
        type: boolean
      import_recruiting:
        description: Import recruiting data for the year below (class = recruits and team class rankings, portal = transfer portal, both = all of it, 3 CFBD calls)
        required: true
        default: skip
        type: choice
        options:
          - skip
          - class
          - portal
          - both
      recruiting_year:
        description: Class year for the recruiting import, or portal year (portal data exists from 2021 on)
        required: false
        default: '2027'
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy database and Edge Functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.76.7

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

  manual-import:
    name: Run selected manual import
    if: github.event_name == 'workflow_dispatch' && (inputs.run_test_import || inputs.import_2025_stage != 'skip' || inputs.import_roster != 'skip' || inputs.import_draft || inputs.import_recruiting != 'skip')
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      IMPORT_STAGE: ${{ inputs.import_2025_stage }}
      IMPORT_SEASON: ${{ inputs.import_season }}
      IMPORT_ROSTER: ${{ inputs.import_roster }}
      ROSTER_OFFSET: ${{ inputs.roster_offset }}
      IMPORT_RECRUITING: ${{ inputs.import_recruiting }}
      RECRUITING_YEAR: ${{ inputs.recruiting_year }}
    steps:
      - name: Request GitHub Actions identity token
        id: oidc
        run: |
          token_response="$(curl --fail --silent --show-error --get \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            --data-urlencode 'audience=strdys-supabase-test-import' \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN")"
          token="$(printf '%s' "$token_response" | jq -er '.value')"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Import 2026 teams, conferences, and calendar
        if: inputs.run_test_import
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          supabase_project_url="${SUPABASE_URL%/}"
          supabase_project_url="${supabase_project_url%/rest/v1}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${supabase_project_url}/functions/v1/test-import-2026" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "x-github-oidc-token: $GITHUB_OIDC_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{}'

      - name: Import archived season stage
        if: inputs.import_2025_stage != 'skip'
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          supabase_project_url="${SUPABASE_URL%/}"
          supabase_project_url="${supabase_project_url%/rest/v1}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${supabase_project_url}/functions/v1/import-2025" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "x-github-oidc-token: $GITHUB_OIDC_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$(jq -cn --arg stage "$IMPORT_STAGE" --arg season "${IMPORT_SEASON:-2025}" '{stage: $stage, season: ($season | tonumber)}')"

      - name: Import team rosters
        if: inputs.import_roster != 'skip'
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          supabase_project_url="${SUPABASE_URL%/}"
          supabase_project_url="${supabase_project_url%/rest/v1}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${supabase_project_url}/functions/v1/import-roster" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "x-github-oidc-token: $GITHUB_OIDC_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$(jq -cn --arg mode "$IMPORT_ROSTER" --arg season "${IMPORT_SEASON:-2025}" --arg offset "${ROSTER_OFFSET:-0}" '{mode: $mode, season: ($season | tonumber), offset: ($offset | tonumber)}')"

      - name: Import real NFL drafts
        if: inputs.import_draft
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          supabase_project_url="${SUPABASE_URL%/}"
          supabase_project_url="${supabase_project_url%/rest/v1}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${supabase_project_url}/functions/v1/import-draft" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "x-github-oidc-token: $GITHUB_OIDC_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{}'

      - name: Import recruiting and transfer portal
        if: inputs.import_recruiting != 'skip'
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          supabase_project_url="${SUPABASE_URL%/}"
          supabase_project_url="${supabase_project_url%/rest/v1}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${supabase_project_url}/functions/v1/import-recruiting" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "x-github-oidc-token: $GITHUB_OIDC_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$(jq -cn --arg mode "$IMPORT_RECRUITING" --arg year "${RECRUITING_YEAR:-2027}" '{mode: $mode, year: ($year | tonumber)}')"
