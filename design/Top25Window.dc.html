<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top 25 window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Graduate&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050607}
a{color:#F2F3F5;text-decoration:none}a:hover{color:#FFFFFF}
.cond{font-family:"Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:0.02em}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #050607; color: #F2F3F5; font-family: Barlow, 'Helvetica Neue', sans-serif; font-size: 14px; display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-label="Top 25 rankings" style="width: 1000px; height: 780px; box-sizing: border-box; background: #15171A; border: 1px solid #2A2E34; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6)">

<div style="display: flex; align-items: center; gap: 16px; padding: 18px 24px 0">
<h2 class="cond" style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: 0.04em">TOP 25</h2>
<span style="color: #8E949C">Week 6 · released Sun 4 Oct</span>
<span style="flex: 1"></span>
<button type="button" class="cond" style="height: 34px; padding: 0 12px; background: #1C1F23; border: 1px solid #2A2E34; border-radius: 6px; color: #F2F3F5; font-size: 14px; font-weight: 600; letter-spacing: 0.04em">WEEK 6 <span style="color: #8E949C">▾</span></button>
<button type="button" aria-label="Close" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: #1C1F23; border: 1px solid #2A2E34; border-radius: 50%; color: #F2F3F5"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"></path></svg></button>
</div>

<div role="tablist" aria-label="Poll" style="display: flex; gap: 4px; padding: 8px 24px 0; border-bottom: 1px solid #23262B">
<button type="button" role="tab" aria-selected="true" class="cond" style="height: 42px; padding: 0 14px; background: transparent; border: 0; border-bottom: 2px solid #F2F3F5; color: #F2F3F5; font-size: 15px; font-weight: 700; letter-spacing: 0.1em">AP POLL</button>
<button type="button" role="tab" aria-selected="false" class="cond" style="height: 42px; padding: 0 14px; background: transparent; border: 0; border-bottom: 2px solid transparent; color: #8E949C; font-size: 15px; font-weight: 700; letter-spacing: 0.1em">COACHES</button>
<button type="button" role="tab" aria-selected="false" class="cond" style="height: 42px; padding: 0 14px; background: transparent; border: 0; border-bottom: 2px solid transparent; color: #8E949C; font-size: 15px; font-weight: 700; letter-spacing: 0.1em">CFP <span style="font-size: 12px; color: #6F757D">FROM NOV</span></button>
</div>

<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; padding: 10px 24px 6px; grid-auto-flow: column; grid-template-rows: repeat(13, minmax(0, 1fr))">
<sc-for list="{{ teams }}" as="t" hint-placeholder-count="25">
<a href="#" style="{{ t.row }}">
<span class="cond num" style="{{ t.rankStyle }}">{{ t.rank }}</span>
<span class="cond num" style="{{ t.moveStyle }}">{{ t.move }}</span>
<span class="cond" style="{{ t.badge }}">{{ t.abbr }}</span>
<span class="cond" style="font-size: 17px; font-weight: 700; white-space: nowrap">{{ t.name }}</span>
<sc-if value="{{ t.hot }}" hint-placeholder-val="{{ false }}"><span class="cond num" style="display: flex; align-items: center; gap: 2px; color: #F08A3C; font-size: 12px; font-weight: 700"><svg width="12" height="12" viewBox="0 0 24 24" fill="#F08A3C"><path d="M12 2c1 3-2 5-2 8a2 2 0 0 0 4 0c0-1 0-2-1-3 3 1 5 4 5 7a6 6 0 0 1-12 0c0-5 4-7 6-12z"></path></svg>{{ t.streak }}</span></sc-if>
<span style="flex: 1"></span>
<span class="cond num" style="color: #C9CDD3; font-size: 15px; width: 36px; text-align: right">{{ t.record }}</span>
</a>
</sc-for>
<div style="display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 0 8px; font-size: 12px; color: #8E949C">
<span><span class="cond" style="font-weight: 700; letter-spacing: 0.08em; color: #C9CDD3">DROPPED OUT</span> Kansas State (16)</span>
<span><span class="cond" style="font-weight: 700; letter-spacing: 0.08em; color: #C9CDD3">ALSO RECEIVING VOTES</span> Boise St 88, Kansas St 61, Utah 40, Clemson 22</span>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var list = [
      ['OSU', 'OHIO STATE', '#BB0000', '6–0', '1,550 (58)', '—', '11'],
      ['IND', 'INDIANA', '#990000', '6–0', '1,481 (4)', '—', '6'],
      ['ORE', 'OREGON', '#154733', '6–0', '1,420', '▲1', '6'],
      ['MIA', 'MIAMI', '#F47321', '6–0', '1,352', '▲4', '6'],
      ['TEX', 'TEXAS', '#BF5700', '5–1', '1,290', '—', ''],
      ['ND', 'NOTRE DAME', '#0C2340', '5–0', '1,201', '▲2', '5'],
      ['BYU', 'BYU', '#002E5D', '6–0', '1,133', '▲3', '9'],
      ['LSU', 'LSU', '#461D7C', '5–1', '1,060', '▲1', ''],
      ['USC', 'USC', '#990000', '5–1', '997', '▲2', ''],
      ['ALA', 'ALABAMA', '#9E1B32', '5–1', '941', '—', ''],
      ['TENN', 'TENNESSEE', '#FF8200', '5–1', '880', '▲1', ''],
      ['UGA', 'GEORGIA', '#BA0C2F', '4–2', '812', '▼5', ''],
      ['MICH', 'MICHIGAN', '#00274C', '5–1', '760', '▼9', ''],
      ['MISS', 'OLE MISS', '#CE1126', '5–1', '702', '▲7', ''],
      ['OU', 'OKLAHOMA', '#841617', '4–2', '640', '▼6', ''],
      ['TTU', 'TEXAS TECH', '#CC0000', '5–1', '588', '▲6', '5'],
      ['PSU', 'PENN STATE', '#041E42', '4–2', '505', '▼6', ''],
      ['VAN', 'VANDERBILT', '#866D4B', '6–0', '441', '▲4', '6'],
      ['ASU', 'ARIZONA ST', '#8C1D40', '5–1', '380', '▲2', '5'],
      ['SMU', 'SMU', '#0033A0', '5–1', '322', '—', ''],
      ['PUR', 'PURDUE', '#CEB888', '5–1', '260', 'NEW', '5'],
      ['ISU', 'IOWA STATE', '#C8102E', '5–1', '211', '▼2', ''],
      ['LOU', 'LOUISVILLE', '#AD0000', '5–1', '170', '▲1', ''],
      ['UNLV', 'UNLV', '#CF0A2C', '6–0', '133', 'NEW', '6'],
      ['TAMU', 'TEXAS A&M', '#500000', '4–2', '102', '▼7', '']
    ];
    var teams = list.map(function (t, i) {
      var mv = t[5];
      var c = mv.charAt(0) === '▲' ? '#4CC38A' : (mv.charAt(0) === '▼' ? '#F0645A' : (mv === 'NEW' ? '#C9CDD3' : '#6F757D'));
      var dark = t[2] === '#CEB888' || t[2] === '#FF8200';
      return {
        rank: String(i + 1), abbr: t[0], name: t[1], record: t[3], pts: t[4], move: mv, hot: !!t[6], streak: t[6],
        row: 'display: flex; align-items: center; gap: 10px; padding: 0 8px; min-height: 0; border-bottom: 1px solid #1E2125; ' + (i === 0 ? 'background: #1D2024; border-radius: 6px;' : ''),
        rankStyle: 'width: 24px; text-align: right; font-size: ' + (i < 5 ? '20' : '17') + 'px; font-weight: 700',
        moveStyle: 'width: 32px; font-size: 12px; font-weight: 700; color: ' + c,
        badge: 'width: 26px; height: 26px; flex-shrink: 0; border-radius: 4px; background: ' + t[2] + '; color: ' + (dark ? '#111214' : '#FFFFFF') + '; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700'
      };
    });
    return { teams: teams };
  }
}
</script>
</body>
</html>
