<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CFB Tracker Heisman Tracker Desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Graduate&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0C0E}
a{color:#F2F3F5;text-decoration:none}a:hover{color:#FFFFFF}
.cond{font-family:"Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:0.02em}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #0B0C0E; color: #F2F3F5; font-family: Barlow, 'Helvetica Neue', sans-serif; font-size: 14px; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 24px; padding: 0 24px; border-bottom: 1px solid #23262B; background: #0E1013">
<div class="cond" style="font-size: 20px; font-weight: 700; letter-spacing: 0.08em"><span style="display: inline-flex; align-items: center; gap: 9px"><span class="varsity" style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 7px; background: #0B0C0E; border: 2px solid #F2F3F5; color: #F2F3F5; display: inline-flex; align-items: center; justify-content: center; font-family: Graduate, serif; font-size: 17px; letter-spacing: 0">S</span>STRDYS</span></div>
<nav aria-label="Main" style="display: flex; gap: 2px; height: 100%">
<sc-for list="{{ nav }}" as="n" hint-placeholder-count="8">
<a href="#" class="cond" style="{{ n.style }}">{{ n.label }}</a>
</sc-for>
</nav>
<div style="flex: 1"></div>
<label style="display: flex; align-items: center; gap: 8px; width: 170px; height: 32px; padding: 0 10px; box-sizing: border-box; background: #15171A; border: 1px solid #2A2E34; border-radius: 6px; color: #8E949C">
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5"></circle><path d="M11 11l3.5 3.5"></path></svg>
<input type="text" placeholder="Search" aria-label="Search teams or players" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: #F2F3F5; font: inherit; font-size: 13px">
</label>
<button type="button" class="cond" style="height: 32px; padding: 0 12px; background: #15171A; border: 1px solid #2A2E34; border-radius: 6px; color: #F2F3F5; font-size: 14px; font-weight: 600; letter-spacing: 0.04em">WEEK 6 <span style="color: #8E949C">▾</span></button>
<button type="button" aria-label="Favorite teams" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: #15171A; border: 1px solid #2A2E34; border-radius: 6px; color: #F2F3F5"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"></path></svg></button>
<div aria-label="Updated Monday 06:02" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 1px solid #23462F; background: #0F1D15; border-radius: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #4CC38A"></span></div>
<button type="button" aria-label="Account" class="cond" style="width: 32px; height: 32px; border-radius: 50%; border: 1px solid #2A2E34; background: #1C1F23; color: #F2F3F5; font-size: 14px; font-weight: 600">B</button>
</header>
<div style="flex-shrink: 0; display: flex; align-items: center; gap: 18px; padding: 14px 24px 0; border-bottom: 1px solid #23262B">
<h1 class="cond" style="margin: 0 10px 0 0; font-size: 28px; font-weight: 700; letter-spacing: 0.04em; padding-bottom: 10px">STATS</h1>
<div role="tablist" aria-label="Stats section" style="display: flex; gap: 4px">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" class="cond" style="{{ t.style }}">{{ t.label }}</button>
</sc-for>
</div>
<span style="flex: 1"></span>
<span style="color: #8E949C; padding-bottom: 10px">Stat-based · updated every Monday</span>
</div>

<div style="flex: 1; min-height: 0; display: flex; gap: 16px; padding: 16px 24px 22px">
<section style="flex: 1; min-width: 0; background: #15171A; border: 1px solid #23262B; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; align-items: center; gap: 16px; padding: 14px 18px 10px">
<h2 class="cond" style="margin: 0; font-size: 16px; font-weight: 700; letter-spacing: 0.1em; color: #C9CDD3">TOP 10 · AFTER WEEK 6</h2>
<span style="flex: 1"></span>
</div>
<div style="flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 10px 10px">
<sc-for list="{{ top }}" as="p" hint-placeholder-count="10">
<button type="button" style="{{ p.row }}">
<span class="cond num" style="{{ p.rankStyle }}">{{ p.rk }}</span>
<span class="cond num" style="{{ p.moveStyle }}">{{ p.move }}</span>
<span class="cond" style="{{ p.badge }}">{{ p.abbr }}</span>
<span style="display: flex; flex-direction: column; min-width: 0"><span class="cond" style="font-size: 18px; font-weight: 700; white-space: nowrap">{{ p.name }}</span><span style="font-size: 12px; color: #8E949C; white-space: nowrap">{{ p.pos }} · {{ p.team }} · {{ p.rec }}</span></span>
<span style="font-size: 13px; color: #C9CDD3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ p.line }}</span>
<span style="display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: #0F1114"><span style="{{ p.barA }}"></span><span style="{{ p.barB }}"></span></span>
<span class="cond num" style="text-align: right; font-size: 20px; font-weight: 700">{{ p.score }}</span>
</button>
</sc-for>
</div>
</section>

<aside style="width: 360px; flex-shrink: 0; background: #15171A; border: 1px solid #23262B; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 14px 18px 8px; display: flex; flex-direction: column; gap: 2px">
<h2 class="cond" style="margin: 0; font-size: 16px; font-weight: 700; letter-spacing: 0.1em; color: #C9CDD3">SEASON FIELD</h2>
<span style="font-size: 12px; color: #8E949C">Everyone who has been in the top 10 this season</span>
</div>
<div class="cond" style="display: grid; grid-template-columns: minmax(0, 1fr) 42px 42px 70px; column-gap: 8px; padding: 6px 18px; color: #8E949C; font-size: 11px; font-weight: 600; letter-spacing: 0.08em"><span>PLAYER</span><span style="text-align: right">PEAK</span><span style="text-align: right">WKS</span><span style="text-align: right">NOW</span></div>
<div style="flex: 1; min-height: 0; overflow: auto; padding: 0 10px 10px">
<sc-for list="{{ field }}" as="f" hint-placeholder-count="14">
<button type="button" style="display: grid; grid-template-columns: minmax(0, 1fr) 42px 42px 70px; column-gap: 8px; align-items: center; width: 100%; min-height: 36px; padding: 0 8px; background: transparent; border: 0; border-bottom: 1px solid #1E2125; font: inherit; color: inherit; text-align: left; font-variant-numeric: tabular-nums">
<span style="display: flex; align-items: center; gap: 8px; min-width: 0"><span class="cond" style="{{ f.badge }}">{{ f.abbr }}</span><span style="font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ f.name }}</span></span>
<span class="cond" style="text-align: right; font-size: 15px; font-weight: 700">{{ f.peak }}</span>
<span style="text-align: right; color: #8E949C">{{ f.wks }}</span>
<span class="cond" style="{{ f.nowStyle }}">{{ f.now }}</span>
</button>
</sc-for>
</div>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var active = 'display: flex; align-items: center; padding: 0 10px; height: 100%; border-bottom: 2px solid #F2F3F5; color: #F2F3F5; font-size: 15px; font-weight: 600; letter-spacing: 0.08em';
    var idle = 'display: flex; align-items: center; padding: 0 10px; height: 100%; border-bottom: 2px solid transparent; color: #8E949C; font-size: 15px; font-weight: 600; letter-spacing: 0.08em';
    var tOn = 'height: 44px; padding: 0 14px; background: transparent; border: 0; border-bottom: 2px solid #F2F3F5; color: #F2F3F5; font-size: 15px; font-weight: 700; letter-spacing: 0.1em';
    var tOff = 'height: 44px; padding: 0 14px; background: transparent; border: 0; border-bottom: 2px solid transparent; color: #8E949C; font-size: 15px; font-weight: 700; letter-spacing: 0.1em';
    var mkTabs = function (on) { return ['PLAYERS', 'TEAMS', 'HEISMAN TRACKER'].map(function (l, i) { return { label: l, style: i === on ? tOn : tOff }; }); };
    var nav = ['HOME', 'SCORES', 'RANKINGS', 'STANDINGS', 'STATS', 'TEAMS', "PICK'EM", 'ARCHIVE'].map(function (l, i) { return { label: l, style: i === 4 ? active : idle }; });
    var chip = 'display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 22px; border-radius: 4px; background: #D9DCE0; border: 1px solid #D9DCE0; color: #2A2E34; font-size: 10px; font-weight: 700';
    var badge = function (c, dark, size) { var s = size || 24; return 'width: ' + s + 'px; height: ' + s + 'px; flex-shrink: 0; border-radius: ' + (size ? '50%' : '4px') + '; background: ' + c + '; color: ' + (dark ? '#111214' : '#FFFFFF') + '; display: flex; align-items: center; justify-content: center; font-size: ' + (s > 30 ? 13 : 10) + 'px; font-weight: 700'; };
    var T = [
      ['IND', 'Indiana', '#990000', 'QB', '6–0', '1,742 pass yds · 19 TD · 2 INT', 66.0, 28.2, '—'],
      ['TEX', 'Texas', '#BF5700', 'RB', '5–1', '912 rush yds · 11 TD · 6.4 avg', 64.1, 25.6, '▲1'],
      ['OSU', 'Ohio State', '#BB0000', 'QB', '6–0', '1,866 pass yds · 16 TD · 1 INT', 59.8, 28.3, '▼1'],
      ['MIA', 'Miami', '#F47321', 'WR', '6–0', '788 rec yds · 9 TD · 46 rec', 57.0, 27.6, '▲2'],
      ['ORE', 'Oregon', '#154733', 'QB', '6–0', '1,690 pass yds · 17 TD · 2 INT', 55.9, 27.9, '—'],
      ['BYU', 'BYU', '#002E5D', 'QB', '6–0', '1,640 pass yds · 13 TD · 140 rush', 54.2, 27.4, '▲3'],
      ['TTU', 'Texas Tech', '#CC0000', 'QB', '5–1', '1,677 pass yds · 12 TD · 5 INT', 55.1, 22.0, 'NEW'],
      ['ND', 'Notre Dame', '#0C2340', 'RB', '5–0', '701 rush yds · 10 TD · 7.1 avg', 51.6, 26.9, '▼2'],
      ['USC', 'USC', '#990000', 'QB', '5–1', '1,801 pass yds · 14 TD · 4 INT', 53.0, 23.1, '▼2'],
      ['UNLV', 'UNLV', '#CF0A2C', 'RB', '6–0', '845 rush yds · 9 TD · 5.9 avg', 54.3, 20.4, 'NEW']
    ];
    var top = T.map(function (t, i) {
      var mv = t[8];
      var c = mv.charAt(0) === '▲' ? '#4CC38A' : (mv.charAt(0) === '▼' ? '#F0645A' : (mv === 'NEW' ? '#C9CDD3' : '#6F757D'));
      return {
        rk: String(i + 1), move: mv, abbr: t[0], team: t[1], pos: t[3], rec: t[4], line: t[5], name: '[' + t[3] + ' Name]',
        score: (t[6] + t[7]).toFixed(1),
        badge: badge(t[2], false, 36),
        barA: 'width: ' + t[6] + '%; background: #F2F3F5',
        barB: 'width: ' + t[7] + '%; background: ' + t[2] + '; filter: brightness(1.4)',
        rankStyle: 'text-align: right; font-size: ' + (i === 0 ? '28' : '20') + 'px; font-weight: 700',
        moveStyle: 'font-size: 12px; font-weight: 700; color: ' + c,
        row: 'display: grid; grid-template-columns: 28px 34px 40px minmax(0, 1.2fr) minmax(0, 1.3fr) 150px 56px; column-gap: 12px; align-items: center; flex: 1; min-height: 0; padding: 0 10px; background: ' + (i === 0 ? '#1D2024' : 'transparent') + '; border: 0; border-bottom: 1px solid #1E2125; border-radius: ' + (i === 0 ? '6px' : '0') + '; font: inherit; color: inherit; text-align: left; font-variant-numeric: tabular-nums'
      };
    });
    var now = function (v) { var on = v.charAt(0) === '#'; return { now: v, nowStyle: 'text-align: right; font-size: ' + (on ? '15' : '12') + 'px; font-weight: 700; color: ' + (on ? '#F2F3F5' : '#8E949C') }; };
    var F = [
      ['IND', '[QB] · Indiana', '#990000', '#1', '6', '#1'], ['OSU', '[QB] · Ohio State', '#BB0000', '#1', '6', '#3'], ['TEX', '[RB] · Texas', '#BF5700', '#2', '6', '#2'],
      ['MIA', '[WR] · Miami', '#F47321', '#4', '5', '#4'], ['ORE', '[QB] · Oregon', '#154733', '#3', '6', '#5'], ['BYU', '[QB] · BYU', '#002E5D', '#6', '3', '#6'],
      ['ND', '[RB] · Notre Dame', '#0C2340', '#4', '4', '#8'], ['USC', '[QB] · USC', '#990000', '#5', '6', '#9'], ['TTU', '[QB] · Texas Tech', '#CC0000', '#7', '1', '#7'],
      ['UNLV', '[RB] · UNLV', '#CF0A2C', '#10', '1', '#10'], ['UGA', '[QB] · Georgia', '#BA0C2F', '#3', '5', 'Out wk 6'], ['MICH', '[RB] · Michigan', '#00274C', '#6', '4', 'Out wk 6'],
      ['ALA', '[QB] · Alabama', '#9E1B32', '#5', '3', 'Out wk 4'], ['LSU', '[QB] · LSU', '#461D7C', '#8', '2', 'Out wk 3']
    ];
    var field = F.map(function (f) { return Object.assign({ abbr: f[0], name: f[1], peak: f[3], wks: f[4], badge: badge(f[2], false) }, now(f[5])); });
    return { nav: nav, tabs: mkTabs(2), top: top, field: field };
  }
}
</script>
</body>
</html>
