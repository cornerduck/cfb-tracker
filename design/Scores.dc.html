<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CFB Tracker Scores Desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Graduate&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0C0E}
a{color:#F2F3F5;text-decoration:none}a:hover{color:#FFFFFF}
.cond{font-family:"Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:0.02em}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #0B0C0E; color: #F2F3F5; font-family: Barlow, 'Helvetica Neue', sans-serif; font-size: 14px; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 24px; padding: 0 24px; border-bottom: 1px solid #23262B; background: #0E1013">
<div class="cond" style="font-size: 20px; font-weight: 700; letter-spacing: 0.08em"><span style="display: inline-flex; align-items: center; gap: 9px"><span class="varsity" style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 7px; background: #0B0C0E; border: 2px solid #F2F3F5; color: #F2F3F5; display: inline-flex; align-items: center; justify-content: center; font-family: Graduate, serif; font-size: 17px; letter-spacing: 0">S</span>STRDYS</span></div>
<nav aria-label="Main" style="display: flex; gap: 2px; height: 100%">
<sc-for list="{{ nav }}" as="n" hint-placeholder-count="8">
<a href="#" class="cond" style="{{ n.style }}">{{ n.label }}</a>
</sc-for>
</nav>
<div style="flex: 1"></div>
<label style="display: flex; align-items: center; gap: 8px; width: 170px; height: 32px; padding: 0 10px; box-sizing: border-box; background: #15171A; border: 1px solid #2A2E34; border-radius: 6px; color: #8E949C">
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5"></circle><path d="M11 11l3.5 3.5"></path></svg>
<input type="text" placeholder="Search" aria-label="Search teams or players" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: #F2F3F5; font: inherit; font-size: 13px">
</label>
<button type="button" class="cond" style="height: 32px; padding: 0 12px; background: #15171A; border: 1px solid #2A2E34; border-radius: 6px; color: #F2F3F5; font-size: 14px; font-weight: 600; letter-spacing: 0.04em">WEEK 6 <span style="color: #8E949C">▾</span></button>
<button type="button" aria-label="Favorite teams" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: #15171A; border: 1px solid #2A2E34; border-radius: 6px; color: #F2F3F5"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"></path></svg></button>
<div aria-label="Updated Monday 06:02" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 1px solid #23462F; background: #0F1D15; border-radius: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #4CC38A"></span></div>
<button type="button" aria-label="Account" class="cond" style="width: 32px; height: 32px; border-radius: 50%; border: 1px solid #2A2E34; background: #1C1F23; color: #F2F3F5; font-size: 14px; font-weight: 600">B</button>
</header>

<div style="flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 14px 24px 0">
<button type="button" aria-label="Previous weeks" style="width: 32px; height: 36px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: #8E949C"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 3L5 8l5 5"></path></svg></button>
<sc-for list="{{ weeks }}" as="w" hint-placeholder-count="17">
<button type="button" class="cond" style="{{ w.style }}"><span style="font-size: 11px; letter-spacing: 0.1em; opacity: 0.75">{{ w.top }}</span><span style="font-size: 16px; font-weight: 700">{{ w.label }}</span></button>
</sc-for>
<button type="button" aria-label="Next weeks" style="width: 32px; height: 36px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: #8E949C"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3l5 5-5 5"></path></svg></button>
</div>

<div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 12px 24px">
<sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
<button type="button" class="cond" style="{{ f.style }}">{{ f.label }}</button>
</sc-for>
<span style="flex: 1"></span>
<span style="color: #8E949C">62 FBS games</span>
</div>

<div style="flex: 1; min-height: 0; display: flex; gap: 16px; padding: 0 24px 22px">
<div style="flex: 1; min-width: 0; overflow: auto; display: flex; flex-direction: column; gap: 16px; padding-right: 4px">
<sc-for list="{{ slots }}" as="s" hint-placeholder-count="4">
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 class="cond" style="margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.12em; color: #C9CDD3">{{ s.label }}</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{ s.games }}" as="g" hint-placeholder-count="3">
<button type="button" style="position: relative; text-align: left; font: inherit; color: inherit; background: #15171A; border: 1px solid #23262B; border-radius: 8px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 8px; width: 100%">
<span style="width: 14px; flex-shrink: 0"></span>
<span class="cond" style="{{ g.a.badge }}">{{ g.a.abbr }}</span>
<span class="cond num" style="width: 18px; font-size: 12px; color: #8E949C; text-align: right">{{ g.a.rank }}</span>
<span class="cond" style="{{ g.a.nameStyle }}">{{ g.a.name }}</span>
<sc-if value="{{ g.a.hot }}" hint-placeholder-val="{{ false }}"><span class="cond num" style="display: flex; align-items: center; gap: 2px; color: #F08A3C; font-size: 12px; font-weight: 700"><svg width="12" height="12" viewBox="0 0 24 24" fill="#F08A3C"><path d="M12 2c1 3-2 5-2 8a2 2 0 0 0 4 0c0-1 0-2-1-3 3 1 5 4 5 7a6 6 0 0 1-12 0c0-5 4-7 6-12z"></path></svg>{{ g.a.streak }}</span></sc-if>
<span style="flex: 1"></span>
<span class="cond num" style="{{ g.a.scoreStyle }}">{{ g.a.score }}</span>
</span>
<span style="display: flex; align-items: center; gap: 8px; width: 100%">
<span class="cond" style="width: 14px; flex-shrink: 0; font-size: 13px; color: #8E949C; text-align: center">@</span>
<span class="cond" style="{{ g.h.badge }}">{{ g.h.abbr }}</span>
<span class="cond num" style="width: 18px; font-size: 12px; color: #8E949C; text-align: right">{{ g.h.rank }}</span>
<span class="cond" style="{{ g.h.nameStyle }}">{{ g.h.name }}</span>
<sc-if value="{{ g.h.hot }}" hint-placeholder-val="{{ false }}"><span class="cond num" style="display: flex; align-items: center; gap: 2px; color: #F08A3C; font-size: 12px; font-weight: 700"><svg width="12" height="12" viewBox="0 0 24 24" fill="#F08A3C"><path d="M12 2c1 3-2 5-2 8a2 2 0 0 0 4 0c0-1 0-2-1-3 3 1 5 4 5 7a6 6 0 0 1-12 0c0-5 4-7 6-12z"></path></svg>{{ g.h.streak }}</span></sc-if>
<span style="flex: 1"></span>
<span class="cond num" style="{{ g.h.scoreStyle }}">{{ g.h.score }}</span>
</span>
<span class="cond" style="display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 0.1em; color: #8E949C; border-top: 1px solid #1E2125; padding-top: 6px"><span>{{ g.status }} · {{ g.tv }}</span><span class="num">{{ g.line }}</span></span>
<sc-if value="{{ g.upset }}" hint-placeholder-val="{{ false }}">
<span class="cond" style="{{ g.stamp }}">{{ g.stampText }}</span>
</sc-if>
</button>
</sc-for>
</div>
</section>
</sc-for>
</div>

<aside style="width: 280px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; padding-top: 26px">
<section style="background: #15171A; border: 1px solid #23262B; border-radius: 8px; padding: 16px 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<h2 class="cond" style="grid-column: span 2; margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.1em; color: #C9CDD3">WEEK 6 IN NUMBERS</h2>
<div><div style="font-size: 12px; color: #8E949C">Ranked teams lost</div><div class="cond num" style="font-size: 26px; font-weight: 700">6</div></div>
<div><div style="font-size: 12px; color: #8E949C">Upsets</div><div class="cond num" style="font-size: 26px; font-weight: 700">3</div></div>
<div><div style="font-size: 12px; color: #8E949C">Overtime games</div><div class="cond num" style="font-size: 26px; font-weight: 700">2</div></div>
<div><div style="font-size: 12px; color: #8E949C">Avg. points</div><div class="cond num" style="font-size: 26px; font-weight: 700">52.4</div></div>
</section>
<section style="background: #15171A; border: 1px solid #23262B; border-radius: 8px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px">
<h2 class="cond" style="margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.1em; color: #C9CDD3">UPSETS THIS WEEK</h2>
<sc-for list="{{ upsets }}" as="u" hint-placeholder-count="3">
<button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0; background: transparent; border: 0; border-bottom: 1px solid #1E2125; font: inherit; color: inherit; text-align: left">
<span class="cond" style="{{ u.tag }}">{{ u.tier }}</span>
<span style="flex: 1; display: flex; flex-direction: column"><span class="cond num" style="font-size: 16px; font-weight: 700">{{ u.game }}</span><span class="num" style="font-size: 12px; color: #8E949C">{{ u.line }}</span></span>
</button>
</sc-for>
</section>
<section style="background: #15171A; border: 1px solid #23262B; border-radius: 8px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px">
<h2 class="cond" style="margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.1em; color: #C9CDD3">RANKED TEAMS THAT LOST</h2>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{ losers }}" as="l" hint-placeholder-count="6">
<span class="cond" style="padding: 4px 8px; border-radius: 4px; background: #2A1416; color: #FF9A9A; font-size: 13px; font-weight: 700">{{ l }}</span>
</sc-for>
</div>
</section>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  badge(color, dark) {
    return 'width: 28px; height: 28px; flex-shrink: 0; border-radius: 6px; background: #D9DCE0; color: ' + (color === '#CEB888' || color === '#FFCD00' ? '#6B5A1E' : color) + '; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700';
  }
  side(t, win) {
    return {
      abbr: t[0], name: t[1], rank: t[3] || '', score: t[4], hot: !!t[5], streak: t[5] || '',
      badge: this.badge(t[2], t[2] === '#CEB888' || t[2] === '#FFCD00'),
      nameStyle: 'font-size: 17px; white-space: nowrap; font-weight: ' + (win ? '700' : '500') + '; color: ' + (win ? '#F2F3F5' : '#8E949C'),
      scoreStyle: 'font-size: 22px; font-weight: 700; color: ' + (win ? '#F2F3F5' : '#8E949C')
    };
  }
  game(a, h, tv, line, extra) {
    var aw = parseInt(a[4], 10) > parseInt(h[4], 10);
    var g = { a: this.side(a, aw), h: this.side(h, !aw), tv: tv, line: line, status: (extra && extra.ot) ? 'FINAL / OT' : 'FINAL', upset: false, stamp: '', stampText: '' };
    if (extra && extra.tier) {
      g.upset = true; g.stampText = extra.tier;
      g.stamp = extra.tier === 'STUNNER'
        ? 'position: absolute; right: 64px; top: 30px; transform: rotate(-7deg); padding: 1px 8px; border-radius: 4px; background: #E5484D; color: #FFFFFF; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; box-shadow: 0 0 14px rgba(229, 72, 77, 0.55)'
        : 'position: absolute; right: 64px; top: 30px; transform: rotate(-7deg); padding: 0 8px; border: 2px solid #F08A3C; border-radius: 4px; color: #F08A3C; font-size: 13px; font-weight: 700; letter-spacing: 0.14em';
    }
    return g;
  }
  renderVals() {
    var active = 'display: flex; align-items: center; padding: 0 10px; height: 100%; border-bottom: 2px solid #F2F3F5; color: #F2F3F5; font-size: 15px; font-weight: 600; letter-spacing: 0.08em';
    var idle = 'display: flex; align-items: center; padding: 0 10px; height: 100%; border-bottom: 2px solid transparent; color: #8E949C; font-size: 15px; font-weight: 600; letter-spacing: 0.08em';
    var wk = function (top, label, state) {
      var st = state === 'on' ? 'background: #F2F3F5; color: #0B0C0E; border: 1px solid #F2F3F5;' : (state === 'next' ? 'background: transparent; color: #F2F3F5; border: 1px dashed #4A4F56;' : 'background: transparent; color: #8E949C; border: 1px solid #23262B;');
      return { top: top, label: label, style: 'min-width: 54px; height: 44px; padding: 0 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 6px; ' + st };
    };
    var weeks = [];
    for (var i = 1; i <= 14; i++) { weeks.push(wk('WEEK', String(i), i === 6 ? 'on' : (i === 7 ? 'next' : 'off'))); }
    weeks.push(wk('CONF', 'CHAMP', 'off')); weeks.push(wk('BOWLS', '', 'off')); weeks.push(wk('CFP', '', 'off'));
    var fOn = 'height: 32px; padding: 0 14px; border-radius: 16px; background: #F2F3F5; color: #0B0C0E; border: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.08em';
    var fOff = 'height: 32px; padding: 0 14px; border-radius: 16px; background: transparent; color: #C9CDD3; border: 1px solid #2A2E34; font-size: 14px; font-weight: 700; letter-spacing: 0.08em';
    var T = {
      PSU: ['PSU', 'PENN STATE', '#041E42', '11'], IND: ['IND', 'INDIANA', '#990000', '2', '', '6'], WIS: ['WIS', 'WISCONSIN', '#C5050C'], OSU: ['OSU', 'OHIO STATE', '#BB0000', '1', '', '11'],
      MSU: ['MSU', 'MICHIGAN ST', '#18453B'], IOWA: ['IOWA', 'IOWA', '#FFCD00'], FSU: ['FSU', 'FLORIDA ST', '#782F40'], MIA: ['MIA', 'MIAMI', '#F47321', '8', '', '6'],
      MISS: ['MISS', 'OLE MISS', '#CE1126', '14'], UGA: ['UGA', 'GEORGIA', '#BA0C2F', '7'], OU: ['OU', 'OKLAHOMA', '#841617', '9'], TEX: ['TEX', 'TEXAS', '#BF5700', '5'],
      TTU: ['TTU', 'TEXAS TECH', '#CC0000', '22', '', '5'], KSU: ['KSU', 'KANSAS ST', '#512888', '16'], PUR: ['PUR', 'PURDUE', '#CEB888', '', '', '5'], MICH: ['MICH', 'MICHIGAN', '#00274C', '4'],
      ORE: ['ORE', 'OREGON', '#154733', '4', '', '6'], WASH: ['WASH', 'WASHINGTON', '#4B2E83'], USC: ['USC', 'USC', '#990000', '11'], ILL: ['ILL', 'ILLINOIS', '#E84A27'],
      SCAR: ['SCAR', 'S CAROLINA', '#73000A'], ALA: ['ALA', 'ALABAMA', '#9E1B32', '10'], AUB: ['AUB', 'AUBURN', '#0C2340'], LSU: ['LSU', 'LSU', '#461D7C', '9'],
      BYU: ['BYU', 'BYU', '#002E5D', '10', '', '9'], UTAH: ['UTAH', 'UTAH', '#CC0000', '24'], BSU: ['BSU', 'BOISE ST', '#0033A0'], UNLV: ['UNLV', 'UNLV', '#CF0A2C', '', '', '6']
    };
    var s = function (k, score) { var t = T[k].slice(); while (t.length < 6) t.push(''); t[4] = score; return t; };
    var self = this;
    return {
      nav: ['HOME', 'SCORES', 'RANKINGS', 'STANDINGS', 'STATS', 'TEAMS', "PICK'EM", 'ARCHIVE'].map(function (l, i) { return { label: l, style: i === 1 ? active : idle }; }),
      weeks: weeks,
      filters: [{ label: 'ALL FBS', style: fOn }, { label: 'TOP 25', style: fOff }, { label: 'MY TEAMS', style: fOff }, { label: 'CONFERENCE ▾', style: fOff }],
      slots: [
        { label: 'SATURDAY 3 OCT · 18:00', games: [
          self.game(s('PSU', '24'), s('IND', '38'), 'FOX', 'IND −6.5'),
          self.game(s('WIS', '3'), s('OSU', '45'), 'BTN', 'OSU −24'),
          self.game(s('FSU', '14'), s('MIA', '35'), 'ESPN', 'MIA −10')
        ] },
        { label: 'SATURDAY 3 OCT · 21:30', games: [
          self.game(s('MISS', '27'), s('UGA', '24'), 'CBS', 'UGA −7.5', { tier: 'UPSET' }),
          self.game(s('OU', '20'), s('TEX', '27'), 'ABC', 'TEX −3'),
          self.game(s('PUR', '27'), s('MICH', '24'), 'NBC', 'MICH −22.5', { tier: 'STUNNER' }),
          self.game(s('TTU', '30'), s('KSU', '28'), 'FOX', 'KSU −2.5', { ot: true })
        ] },
        { label: 'SUNDAY 4 OCT · 01:30', games: [
          self.game(s('ORE', '31'), s('WASH', '17'), 'NBC', 'ORE −9'),
          self.game(s('USC', '34'), s('ILL', '21'), 'CBS', 'USC −5.5'),
          self.game(s('SCAR', '10'), s('ALA', '31'), 'ESPN', 'ALA −13'),
          self.game(s('AUB', '17'), s('LSU', '28'), 'SECN', 'LSU −8')
        ] },
        { label: 'SUNDAY 4 OCT · 04:30', games: [
          self.game(s('BYU', '24'), s('UTAH', '20'), 'ESPN', 'UTAH −1.5', { ot: true }),
          self.game(s('BSU', '17'), s('UNLV', '20'), 'CBSSN', 'BSU −3')
        ] }
      ],
      upsets: [
        { tier: 'STUNNER', game: 'PUR 27 @ #4 MICH 24', line: 'Purdue +22.5', tag: 'width: 76px; text-align: center; padding: 3px 0; border-radius: 4px; background: #E5484D; color: #FFFFFF; font-size: 12px; font-weight: 700; letter-spacing: 0.1em' },
        { tier: 'BIG UPSET', game: 'ECU 31 @ ARMY 28', line: 'East Carolina +14.5', tag: 'width: 76px; text-align: center; padding: 3px 0; border-radius: 4px; background: #3A2210; color: #F08A3C; font-size: 12px; font-weight: 700; letter-spacing: 0.1em' },
        { tier: 'UPSET', game: '#14 MISS 27 @ #7 UGA 24', line: 'Ole Miss +7.5', tag: 'width: 76px; text-align: center; padding: 1px 0; border-radius: 4px; border: 2px solid #F08A3C; color: #F08A3C; font-size: 12px; font-weight: 700; letter-spacing: 0.1em' }
      ],
      losers: ['#4 MICH', '#7 UGA', '#9 OU', '#11 PSU', '#16 KSU', '#24 UTAH']
    };
  }
}
</script>
</body>
</html>
