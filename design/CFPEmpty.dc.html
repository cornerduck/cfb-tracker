<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CFP rankings empty state desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Graduate&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0C0E}
a{color:#F2F3F5;text-decoration:none}a:hover{color:#FFFFFF}
.cond{font-family:"Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:0.02em}
.varsity{font-family:Graduate,"Rockwell","Courier New",serif}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #0B0C0E; color: #F2F3F5; font-family: Barlow, 'Helvetica Neue', sans-serif; font-size: 14px; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 24px; padding: 0 24px; border-bottom: 1px solid #23262B; background: #0E1013">
<div class="cond" style="font-size: 20px; font-weight: 700; letter-spacing: 0.08em"><span style="display: inline-flex; align-items: center; gap: 9px"><span class="varsity" style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 7px; background: #0B0C0E; border: 2px solid #F2F3F5; color: #F2F3F5; display: inline-flex; align-items: center; justify-content: center; font-family: Graduate, serif; font-size: 17px; letter-spacing: 0">S</span>STRDYS</span></div>
<nav aria-label="Main" style="display: flex; gap: 2px; height: 100%">
<sc-for list="{{ nav }}" as="n" hint-placeholder-count="8">
<a href="#" class="cond" style="{{ n.style }}">{{ n.label }}</a>
</sc-for>
</nav>
<div style="flex: 1"></div>
<label style="display: flex; align-items: center; gap: 8px; width: 170px; height: 32px; padding: 0 10px; box-sizing: border-box; background: #15171A; border: 1px solid #2A2E34; border-radius: 6px; color: #8E949C">
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5"></circle><path d="M11 11l3.5 3.5"></path></svg>
<input type="text" placeholder="Search" aria-label="Search teams or players" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: #F2F3F5; font: inherit; font-size: 13px">
</label>
<button type="button" class="cond" style="height: 32px; padding: 0 12px; background: #15171A; border: 1px solid #2A2E34; border-radius: 6px; color: #F2F3F5; font-size: 14px; font-weight: 600; letter-spacing: 0.04em">WEEK 6 <span style="color: #8E949C">▾</span></button>
<button type="button" aria-label="Favorite teams" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: #15171A; border: 1px solid #2A2E34; border-radius: 6px; color: #F2F3F5"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"></path></svg></button>
<div aria-label="Updated Monday 06:02" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 1px solid #23462F; background: #0F1D15; border-radius: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #4CC38A"></span></div>
<button type="button" aria-label="Account" class="cond" style="width: 32px; height: 32px; border-radius: 50%; border: 1px solid #2A2E34; background: #1C1F23; color: #F2F3F5; font-size: 14px; font-weight: 600">B</button>
</header><div style="flex-shrink: 0; display: flex; align-items: center; gap: 18px; padding: 14px 24px 0; border-bottom: 1px solid #23262B"><h1 class="cond" style="margin: 0 10px 0 0; font-size: 28px; font-weight: 700; letter-spacing: 0.04em; padding-bottom: 10px">RANKINGS</h1><button type="button" role="tab" class="cond" style="height: 44px; padding: 0 14px; background: transparent; border: 0; border-bottom: 2px solid transparent; color: #8E949C; font-size: 15px; font-weight: 700; letter-spacing: 0.1em">AP POLL</button><button type="button" role="tab" class="cond" style="height: 44px; padding: 0 14px; background: transparent; border: 0; border-bottom: 2px solid transparent; color: #8E949C; font-size: 15px; font-weight: 700; letter-spacing: 0.1em">COACHES</button><button type="button" role="tab" class="cond" style="height: 44px; padding: 0 14px; background: transparent; border: 0; border-bottom: 2px solid #F2F3F5; color: #F2F3F5; font-size: 15px; font-weight: 700; letter-spacing: 0.1em">CFP RANKINGS</button><button type="button" role="tab" class="cond" style="height: 44px; padding: 0 14px; background: transparent; border: 0; border-bottom: 2px solid transparent; color: #8E949C; font-size: 15px; font-weight: 700; letter-spacing: 0.1em">PLAYOFF BRACKET</button></div><div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px">
<div style="max-width: 520px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
<span class="cond" style="font-size: 14px; font-weight: 700; letter-spacing: 0.16em; color: #8E949C">FIRST CFP RANKING IN</span>
<span class="cond num" style="font-size: 72px; font-weight: 700; line-height: 0.9">28D 14H</span>
<span style="color: #C9CDD3">The selection committee releases its first Top 25 on Wednesday 4 November at 02:00. Until then, the playoff picture is projected from the AP Poll.</span>
<a href="#" class="cond" style="margin-top: 6px; display: flex; align-items: center; height: 46px; padding: 0 20px; border-radius: 6px; background: #F2F3F5; color: #0B0C0E; font-size: 15px; font-weight: 700; letter-spacing: 0.1em">SEE PROJECTED BRACKET</a>
</div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var active = 'display: flex; align-items: center; padding: 0 10px; height: 100%; border-bottom: 2px solid #F2F3F5; color: #F2F3F5; font-size: 15px; font-weight: 600; letter-spacing: 0.08em';
    var idle = 'display: flex; align-items: center; padding: 0 10px; height: 100%; border-bottom: 2px solid transparent; color: #8E949C; font-size: 15px; font-weight: 600; letter-spacing: 0.08em';
    return { nav: ['HOME', 'SCORES', 'RANKINGS', 'STANDINGS', 'STATS', 'TEAMS', "PICK'EM", 'ARCHIVE'].map(function (l, i) { return { label: l, style: i === 2 ? active : idle }; }) };
  }
}
</script>
</body>
</html>
